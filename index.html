<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ελληνικά — греческий A2/B1</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ελληνικά">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#0d5eaf">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230d5eaf'/><text x='50' y='72' font-size='64' text-anchor='middle' fill='white' font-family='Georgia'>Ε</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#home"><span class="logo">Ε</span><span>Ελληνικά</span></a>
    <nav id="nav">
      <a href="#cards">Карточки</a>
      <a href="#verbs">Глаголы</a>
      <a href="#spelling">Правописание</a>
      <a href="#grammar">Справочник</a>
      <a href="#stats">Прогресс</a>
    </nav>
    <div class="top-right">
      <div class="level" role="group" aria-label="Уровень">
        <button data-level="A2">A2</button><button data-level="B1">B1</button>
      </div>
      <button class="icon-btn" id="settingsBtn" title="Настройки" aria-label="Настройки">⚙︎</button>
    </div>
  </header>

  <main id="app"></main>

  <dialog id="settings">
    <form method="dialog">
      <h2>Настройки</h2>
      <label class="row"><input type="checkbox" name="strict"> Строгая проверка ударений</label>
      <label class="row"><input type="checkbox" name="latin"> Печатать греческим с латинской раскладки</label>
      <p class="hint">a→α, b→β, g→γ, d→δ, e→ε, z→ζ, h→η, u→θ, i→ι, k→κ, l→λ, m→μ, n→ν, j→ξ, o→ο, p→π, r→ρ, s→σ, t→τ, y→υ, f→φ, x→χ, c→ψ, v→ω.
        Ударение: <kbd>;</kbd> перед гласной (;a → ά). Диерезис: <kbd>:</kbd> (:i → ϊ).</p>
      <label class="row"><input type="checkbox" name="autoSpeak"> Озвучивать греческое слово автоматически</label>
      <label class="row">Скорость речи <input type="range" name="rate" min="0.5" max="1.2" step="0.05"></label>
      <label class="row">Новых карточек за сессию <input type="number" name="newPerSession" min="5" max="100" step="5"></label>
      <div class="actions"><button class="btn primary" value="ok">Готово</button></div>
    </form>
  </dialog>

  <div id="toast" role="status"></div>

  <script src="js/data-verbs.js"></script>
  <script src="js/data-verbs-extra.js"></script>
  <script src="js/data-nouns.js"></script>
  <script src="js/data-vocab.js"></script>
  <script src="js/data-exam.js"></script>
  <script src="js/data-reference.js"></script>
  <script src="js/greek.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
